name: AeroOS PR Bot

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  pull-requests: write

jobs:
  pr-summary:
    name: Post PR Component Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summarize changed components
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const areas = new Set();
            for (const f of files) {
              if (f.filename.startsWith('src/aero-hub/')) areas.add('Control Hub (`aero-hub` · Rust)');
              else if (f.filename.startsWith('src/aero-webapp/')) areas.add('WebApps CLI (`aero-webapp` · Rust)');
              else if (f.filename.startsWith('src/aero-browser/')) areas.add('Aero Browser (`aero-browser` · C++17/Qt5)');
              else if (f.filename.startsWith('configs/')) areas.add('Wayland / Theme Configs');
              else if (f.filename.startsWith('docs/')) areas.add('Website & Hub UI (`docs/`)');
              else if (f.filename === 'Dockerfile') areas.add('Docker Container');
              else if (f.filename.endsWith('.sh')) areas.add('Setup / ISO Scripts');
              else if (f.filename.startsWith('.github/')) areas.add('CI / GitHub Actions');
            }
            const marker = '<!-- aeroos-pr-bot -->';
            const list = areas.size ? [...areas].map(a => `- ${a}`).join('\n') : '- General repository files';
            const body = `${marker}\n### AeroOS Bot — PR Summary\n**Changed files:** ${files.length}\n\n**Affected components:**\n${list}\n\nCI checks will validate shell scripts, JSON configs, Rust/C++17 builds, and the Docker image.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
